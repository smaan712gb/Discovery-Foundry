[project]
name = "foundry"
version = "0.1.0"
description = "NQ Discovery Foundry v0: a research engine that searches for NQ futures strategies and tries hard to kill them."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "numpy>=2.0",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "tzdata>=2024.2",
    "numba>=0.67.0",
    "jsonschema>=4.26.0",
    "lightgbm>=4.7.0",
    "cma>=4.5.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
foundry = "foundry.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["foundry"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "cma", "cma.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "realdata: tests that read the owner's raw data files (skipped when absent)",
]
