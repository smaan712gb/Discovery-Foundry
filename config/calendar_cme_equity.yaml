# CME Globex equity-index (NQ) trading calendar, all times America/New_York.
#
# Entered by hand from NYSE holiday schedules and CME holiday notices. It has NOT been checked
# against every CME notice (see TODO.md). The data build flags any bar that contradicts this file
# (OUTSIDE bars on a "closed" date, bars after an early halt), so errors here show up in the data
# report instead of passing silently.
#
# kind:
#   closed      - no Globex session for this trading date at all
#   holiday     - NYSE closed, no RTH; Globex trades an abbreviated session to globex_close
#   early_close - RTH ends at rth_close; Globex halts at globex_close
name: cme_equity_index
covers_from: 2018-01-01
covers_to: 2026-12-31
defaults:
  holiday_globex_close: "13:00"
  early_close_rth_close: "13:00"
  early_close_globex_close: "13:15"
entries:
  # 2018
  - {date: 2018-01-01, kind: closed, note: "New Year's Day"}
  - {date: 2018-01-15, kind: holiday, note: "Martin Luther King Jr. Day"}
  - {date: 2018-02-19, kind: holiday, note: "Presidents Day"}
  - {date: 2018-03-30, kind: closed, note: "Good Friday"}
  - {date: 2018-05-28, kind: holiday, note: "Memorial Day"}
  - {date: 2018-07-03, kind: early_close, note: "Independence Day eve"}
  - {date: 2018-07-04, kind: holiday, note: "Independence Day"}
  - {date: 2018-09-03, kind: holiday, note: "Labor Day"}
  - {date: 2018-11-22, kind: holiday, note: "Thanksgiving"}
  - {date: 2018-11-23, kind: early_close, note: "Day after Thanksgiving"}
  - {date: 2018-12-05, kind: holiday, note: "National Day of Mourning (G.H.W. Bush); verify halt time"}
  - {date: 2018-12-24, kind: early_close, note: "Christmas Eve"}
  - {date: 2018-12-25, kind: closed, note: "Christmas"}
